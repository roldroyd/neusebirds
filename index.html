 let title;try{title=decodeURIComponent(u.pathname.slice(6));}catch{return null;}
 return u.hostname==='en.wikipedia.org'&&!u.port&&u.pathname.startsWith('/wiki/')&&title&&!title.includes(':')&&!u.search&&!u.hash?u.href:null;
}
function photo(b,index,compact=false){
 const s=b.species,wrap=element('div',undefined,'photo'),placeholder=element('span','Photo unavailable','placeholder');
 const wiki=wikipedia(s.wikipediaUrl),surface=wiki?link('',wiki):element('div');surface.className='photo-link';
 surface.setAttribute('aria-label',wiki?'Read about '+s.commonName+' on Wikipedia (opens in a new tab)':'Photo of '+s.commonName+'; Wikipedia article unavailable');
 surface.append(placeholder);wrap.append(surface);
 const url=(compact?https(s.thumbnailUrl):null)||https(s.imageUrl);
 if(url){const img=element('img');img.alt=s.commonName;img.width=400;img.height=400;img.loading=index<3?'eager':'lazy';img.decoding='async';img.referrerPolicy='no-referrer';img.addEventListener('error',()=>{img.remove();placeholder.textContent='Photo unavailable';});img.src=url;surface.append(img);}
 return {wrap};
}
function serviceUrl(value,host,path){
 const url=https(value);if(!url)return null;const u=new URL(url);
 return u.hostname===host&&!u.port&&!u.search&&!u.hash&&path.test(u.pathname)?u.href:null;
}
function cardLinks(s){
 const nav=element('nav',undefined,'card-links');nav.setAttribute('aria-label','Explore '+s.commonName);
 const ebird=serviceUrl(s.ebirdUrl,'ebird.org',/^\/species\/[a-z0-9]+\/?$/);
 const code=typeof s.ebirdCode==='string'&&/^[a-z0-9]+$/.test(s.ebirdCode)?s.ebirdCode:null;
 const entries=[['Wiki',wikipedia(s.wikipediaUrl),'Wikipedia article'],['ebird',ebird,'eBird species overview'],['Sightings',code?'https://ebird.org/map/'+encodeURIComponent(code):null,'Worldwide eBird sightings map'],['BW',serviceUrl(s.birdweatherUrl,'app.birdweather.com',/^\/species\/[a-z0-9-]+\/?$/),'BirdWeather species page'],['Images','https://search.brave.com/images?q='+encodeURIComponent(s.commonName+' '+s.scientificName),'Brave image search']];
 for(const [label,url,title] of entries){const item=url?link(label,url):element('span',label);item.title=url?title+' (opens in a new tab)':title+' unavailable: species metadata missing or unsafe';if(!url){item.className='unavailable';item.setAttribute('aria-disabled','true');}nav.append(item);}
 return nav;
}
let ageLabels=[];
function relativeAge(value,now=Date.now()){
 const time=typeof value==='string'?Date.parse(value):NaN,age=now-time;
 if(!Number.isFinite(time)||age<0)return 'Last heard unavailable';
 if(age<3600000){const minutes=Math.round(age/60000);return minutes===0?'Last heard just now':'Last heard '+minutes+'m ago';}
 if(age>86400000){const days=Math.round(age/86400000);return 'Last heard '+days+(days===1?' day ago':' days ago');}
 return 'Last heard '+Math.round(age/3600000)+'h ago';
}
function ageText(b){return b.latestPending?'Last heard loading…':relativeAge(b.latestAt);}
function updateAges(){for(const entry of ageLabels)entry.node.textContent=ageText(entry.bird);}
function names(bird){const s=bird.species,box=element('div'),age=element('p',ageText(bird),'last-heard');box.append(element('h3',s.commonName),element('p',s.scientificName,'latin'),age);ageLabels.push({node:age,bird});return box;}

function applySummary(window){
 if(window&&window.label)$('window-label').textContent=window.label;
 if(!current)return;
 $('species-total').textContent=current.counts.species.toLocaleString();
 $('detections-total').textContent=current.counts.detections.toLocaleString();
}
function render(){
 if(!current)return;
 ageLabels=[];
 $('station').textContent=current.name;
 applySummary(currentWindow);
 const term=$('filter').value.toLowerCase().trim();
 const birds=current.topSpecies.filter(b=>(b.species.commonName+' '+b.species.scientificName).toLowerCase().includes(term)).sort(compareBirds);
 $('results-count').textContent=birds.length+' of '+current.topSpecies.length+' species shown'+($('sort').value==='recent'&&!current.recentReady?' · Most recent not loaded; displaying counts':'');
 $('cards').replaceChildren();$('rows').replaceChildren();$('cards').hidden=view!=='cards';$('table-wrap').hidden=view!=='table';
 $('view-cards').setAttribute('aria-pressed',String(view==='cards'));$('view-table').setAttribute('aria-pressed',String(view==='table'));
 birds.forEach((b,index)=>{
  if(view==='cards'){
   const card=element('article',undefined,'card'),image=photo(b,index),body=element('div',undefined,'card-body');
   body.append(names(b));const badge=element('span',b.count.toLocaleString(),'detection-badge');badge.setAttribute('aria-label',b.count+' detections');image.wrap.append(badge);
   card.append(image.wrap,body,cardLinks(b.species));$('cards').append(card);
  }else{
   const row=element('tr'),name=element('td'),count=element('td',b.count.toLocaleString(),'table-count'),cell=element('div',undefined,'table-species'),image=photo(b,index,true);image.wrap.className='photo compact-photo';cell.append(image.wrap,names(b));name.append(cell);row.append(name,count);$('rows').append(row);
  }
 });
 $('empty').hidden=birds.length!==0;$('empty').textContent=current.topSpecies.length?'No species match your search.':'No detections in this snapshot.';
}
function setSchedule(){
 if(timer!==null){clearInterval(timer);timer=null;}
 if($('minutes').value.length>2)$('minutes').value=$('minutes').value.slice(0,2);
 const text=$('minutes').value.trim(),minutes=Number(text);
 if(!/^\d+$/.test(text)||!Number.isInteger(minutes)||minutes<1||minutes>99){
  $('interval-error').textContent='Enter a whole number from 1 to 99 minutes.';
  return;
 }
 $('interval-error').textContent='';
 if($('auto').checked)timer=setInterval(refresh,minutes*60000);
}
async function latestTimes(station,window,signal,version){
 const birds=station.topSpecies;
 for(let start=0;start<birds.length;start+=3){
  if(version!==generation)return false;
  const group=birds.slice(start,start+3);
  const fields=group.map((b,i)=>'s'+i+': detections(first:1, stationIds:[22946], speciesId:'+JSON.stringify(b.species.id)+', period:$period) { nodes { timestamp station { id } speciesId } }').join(' ');
  const payload=await requestJson({query:'query($period:InputDuration){'+fields+'}',variables:{period:window.period}},signal);
  if(version!==generation)return false;
  group.forEach((b,i)=>{
   const nodes=payload.data['s'+i]&&payload.data['s'+i].nodes;
   if(!Array.isArray(nodes)||nodes.length>1)throw new Error('Unexpected latest detection response.');
   const n=nodes[0];if(n&&(!n.station||n.station.id!=='22946'||n.speciesId!==b.species.id))throw new Error('Latest detection scope mismatch.');
   const time=n?Date.parse(n.timestamp):NaN;
   if(Number.isFinite(time)){
    const from=window.period.from,to=Date.parse(window.period.to);
    const inStart=from.length===19?easternDate(new Date(time))===from.slice(0,10):time>=Date.parse(from);
    if(!inStart||time>to)throw new Error('Latest detection outside the selected window.');
   }
   b.latestAt=Number.isFinite(time)?n.timestamp:null;b.latestPending=false;
  });
  if(current===station)updateAges();
 }
 return true;
}
function recentTime(b){const t=Date.parse(b.latestAt);return Number.isFinite(t)?t:-Infinity;}
function compareBirds(a,b){
 const names=()=>a.species.commonName.localeCompare(b.species.commonName);
 if($('sort').value==='name')return names();
 if($('sort').value==='recent'&&current&&current.recentReady){const x=recentTime(a),y=recentTime(b);if(x!==y)return x>y?-1:1;return names()||b.count-a.count;}
 return b.count-a.count||names();
}
async function refresh(reuse=false){
 if(busy)return;
 const version=generation,usingCache=reuse===true&&current&&currentWindow;
 const window=usingCache?currentWindow:periodWindow($('period').value);
 busy=true;$('refresh').disabled=true;$('refresh').textContent='Refreshing…';$('status').textContent='';$('error').textContent='';
 const controller=new AbortController();let timedOut=false,published=false,next=null;
 const timeout=setTimeout(()=>{timedOut=true;controller.abort();},120000);
 try{
  if(usingCache)next=current;
  else{
   next=validate(await fetchFull(queryText,window,controller.signal));
   if(version!==generation)return;
   next.recentReady=false;next.latestLoading=true;
   for(const bird of next.topSpecies){bird.latestAt=null;bird.latestPending=true;}
   current=next;currentWindow=window;
   render();
  }
  if(version!==generation)return;
  published=true;
  if(!next.recentReady){
   next.recentReady=await latestTimes(next,window,controller.signal,version);
  }
  if(version!==generation)return;
  next.latestLoading=false;for(const bird of next.topSpecies)bird.latestPending=false;updateAges();
  if($('sort').value==='recent')render();
  else $('results-count').textContent=$('results-count').textContent.replace(' · Most recent not loaded; displaying counts','');
  $('status').textContent='';
 }catch(e){
  if(version!==generation)return;
  if(published&&current===next){
   next.latestLoading=false;next.recentReady=false;
   for(const bird of next.topSpecies)bird.latestPending=false;
   updateAges();
   $('status').textContent='';
  }else $('status').textContent='Refresh failed; keeping the last good snapshot.';
  $('error').textContent=timedOut?'The update timed out (up to 120 seconds overall; 30 seconds per request). Try again.':(e instanceof SyntaxError?'BirdWeather returned invalid JSON. Try again.':e.message||'Network error.');
 }finally{clearTimeout(timeout);busy=false;$('refresh').disabled=false;$('refresh').textContent='Refresh now';if(queued){queued=false;refresh();}}
}
try{current=validate(JSON.parse($('saved').textContent));render();}
catch(e){$('error').textContent='Included snapshot unavailable: '+e.message;}
$('period').addEventListener('change',()=>{if(current&&current.latestLoading){current.latestLoading=false;for(const bird of current.topSpecies)bird.latestPending=false;updateAges();}generation++;if(busy){queued=true;$('status').textContent='Period change queued; displayed results retain their labeled window.';}else refresh();});
$('filter').addEventListener('input',render);
$('sort').addEventListener('change',render);
$('view-cards').addEventListener('click',()=>{view='cards';render();});
$('view-table').addEventListener('click',()=>{view='table';render();});
$('refresh').addEventListener('click',refresh);
$('auto').addEventListener('change',setSchedule);
$('minutes').addEventListener('input',setSchedule);
setSchedule();setInterval(updateAges,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateAges();});refresh();

</script></body></html>
